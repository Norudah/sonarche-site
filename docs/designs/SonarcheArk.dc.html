<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes ark-float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-8px)}}
@keyframes ark-roll{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes ark-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
@keyframes ark-cargo{0%,100%{transform:translateY(0.14px)}50%{transform:translateY(-0.14px)}}
@keyframes ark-wake{0%,100%{transform:scaleX(0.88);opacity:0.5}50%{transform:scaleX(1.14);opacity:0.12}}
@keyframes ark-porthole{0%,100%{opacity:1}50%{opacity:0.45}}
</style>
</helmet>
<div style="position:relative;width:100%;aspect-ratio:1/1">
  <div style="position:absolute;inset:0;animation:ark-float 4.7s ease-in-out infinite">
    <div style="position:absolute;inset:0;animation:ark-roll 6.3s ease-in-out infinite;transform-origin:50% 74%">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
        <defs>
          <clipPath id="ark-head-clip">
            <path d="M7.5 12V9.75C7.5 8.85 8.4 8.2 9.7 8 10.5 7.88 13.5 7.88 14.3 8 15.6 8.2 16.5 8.85 16.5 9.75V12Z"></path>
          </clipPath>
        </defs>

        <g style="animation:ark-wake 3.4s ease-in-out infinite;transform-origin:12px 20px;transform-box:view-box">
          <ellipse cx="12" cy="20.1" rx="11.4" ry="0.5" fill="#6163f2" opacity="0.35"></ellipse>
        </g>

        <path d="M7.5 12V9.75C7.5 8.85 8.4 8.2 9.7 8 10.5 7.88 13.5 7.88 14.3 8 15.6 8.2 16.5 8.85 16.5 9.75V12Z" fill="#c5cbef"></path>
        <g clip-path="url(#ark-head-clip)">
          <rect x="7.5" y="7.8" width="9" height="0.85" fill="#e2e7fc"></rect>
          <rect x="7.5" y="11.4" width="9" height="0.6" fill="#a5aede"></rect>
        </g>
        <g style="animation:ark-blink 6.8s ease-in-out infinite;transform-origin:12px 10.05px;transform-box:view-box">
          <rect x="9" y="9.05" width="2" height="2" rx="0.75" fill="#222652"></rect>
          <rect x="13" y="9.05" width="2" height="2" rx="0.75" fill="#222652"></rect>
          <circle cx="9.6" cy="9.65" r="0.42" fill="#818cf9"></circle>
          <circle cx="13.6" cy="9.65" r="0.42" fill="#818cf9"></circle>
        </g>

        <g style="animation:ark-cargo 3.9s ease-in-out infinite;transform-box:view-box">
          <rect x="3" y="9" width="2" height="3" rx="0.5" fill="#efa831"></rect>
          <rect x="3" y="9" width="2" height="0.45" rx="0.22" fill="#fae1b8"></rect>
          <rect x="3" y="10.3" width="2" height="0.5" fill="#fae1b8"></rect>
          <rect x="19" y="9" width="2" height="3" rx="0.5" fill="#efa831"></rect>
          <rect x="19" y="9" width="2" height="0.45" rx="0.22" fill="#fae1b8"></rect>
          <rect x="19" y="10.3" width="2" height="0.5" fill="#fae1b8"></rect>
        </g>
        <g style="animation:ark-cargo 3.9s ease-in-out -1.3s infinite;transform-box:view-box">
          <rect x="5.1" y="10" width="1.5" height="2" rx="0.45" fill="#3d4097"></rect>
          <rect x="5.1" y="10" width="1.5" height="0.4" rx="0.2" fill="#818cf9"></rect>
          <rect x="5.1" y="10.9" width="1.5" height="0.45" fill="#818cf9"></rect>
          <rect x="17.4" y="10" width="1.5" height="2" rx="0.45" fill="#3d4097"></rect>
          <rect x="17.4" y="10" width="1.5" height="0.4" rx="0.2" fill="#818cf9"></rect>
          <rect x="17.4" y="10.9" width="1.5" height="0.45" fill="#818cf9"></rect>
        </g>

        <rect x="1.6" y="12" width="20.8" height="1.1" rx="0.55" fill="#818cf9"></rect>
        <path d="M2.2 13.2h19.6q.75 0 .65.75l-.45 2.6q-.6 3.25-3.4 3.25H5.4q-2.8 0-3.4-3.25l-.45-2.6q-.1-.75.65-.75Z" fill="#3d4097"></path>
        <path d="M2.2 13.2h19.6q.75 0 .65.75H1.55q-.1-.75.65-.75Z" fill="#4f52c1"></path>
        <path d="M3.7 16.5h16.6l-.3 1.15q-.75 2.45-2.9 2.45H6.9q-2.15 0-2.9-2.45Z" fill="#2e3172"></path>
        <path d="M3.7 16.5h16.6l-.14.55H3.84Z" fill="#3d4097"></path>
        <g fill="#818cf9">
          <circle cx="5.6" cy="15" r="0.45" style="animation:ark-porthole 2.8s ease-in-out infinite"></circle>
          <circle cx="9.7" cy="15" r="0.45" style="animation:ark-porthole 2.8s ease-in-out -0.7s infinite"></circle>
          <circle cx="14.3" cy="15" r="0.45" style="animation:ark-porthole 2.8s ease-in-out -1.4s infinite"></circle>
          <circle cx="18.4" cy="15" r="0.45" style="animation:ark-porthole 2.8s ease-in-out -2.1s infinite"></circle>
        </g>
      </svg>
      <div data-onde-dock="{{ dock }}" style="position:absolute;left:50%;top:22.5%;width:44px;height:26px;transform:translate(-50%,-50%)"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:320},&quot;dock&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { dock: this.props.dock ?? 'ark' };
  }
}
</script>
</body>
</html>
